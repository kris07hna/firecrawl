<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px;
    background-color: #f5f5f5;
  }
  h2 {
    font-size: 16px;
    margin-top: 0;
  }
  .drop-zone {
    border: 2px dashed #18A0FB;
    border-radius: 8px;
    padding: 40px 20px;
    text-align: center;
    background: #fff;
    cursor: pointer;
    transition: background 0.2s;
  }
  .drop-zone:hover {
    background: #e5f4ff;
  }
  .instructions {
    font-size: 12px;
    color: #666;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <h2>Import Open Design Flow</h2>
  <div class="drop-zone" id="drop-zone">
    Click here to select the unzipped output folder<br/>(Select all the images and the JSON files)
    <input type="file" id="file-input" multiple style="display:none;" />
  </div>
  <div class="instructions">
    Wait a moment for Figma to process the images after selecting.
  </div>

<script>
  const fileInput = document.getElementById('file-input');
  document.getElementById('drop-zone').onclick = () => fileInput.click();
  
  fileInput.onchange = async (e) => {
    const files = Array.from(e.target.files);
    let sitemap = null;
    let images = {}; // filename -> Uint8Array
    
    // Parse all dropped files
    for (const file of files) {
      if (file.name.includes('.json')) {
        const text = await file.text();
        try {
          sitemap = JSON.parse(text);
        } catch(err) {
          console.error("Failed to parse JSON", file.name);
        }
      } else if (file.name.match(/\.(png|jpg|jpeg)$/i)) {
        const buffer = await file.arrayBuffer();
        
        // Downscale image if it exceeds Figma's 4096px dimension limit
        const blob = new Blob([buffer], { type: file.type || 'image/png' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = url;
        });
        
        const MAX_SIZE = 4000;
        if (img.width > MAX_SIZE || img.height > MAX_SIZE) {
           const scale = Math.min(MAX_SIZE / img.width, MAX_SIZE / img.height);
           const canvas = document.createElement('canvas');
           canvas.width = img.width * scale;
           canvas.height = img.height * scale;
           const ctx = canvas.getContext('2d');
           ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
           
           const newBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
           const newBuffer = await newBlob.arrayBuffer();
           images[file.name] = new Uint8Array(newBuffer);
        } else {
           images[file.name] = new Uint8Array(buffer);
        }
        URL.revokeObjectURL(url);
      }
    }
    
    if (sitemap) {
      // Send the parsed json and image buffers to the figma plugin sandbox
      parent.postMessage({ pluginMessage: { type: 'import', sitemap, images } }, '*');
    } else {
      alert("No JSON file found! Make sure you selected the sitemap or userflow JSON file.");
    }
  };
</script>
</body>
</html>
